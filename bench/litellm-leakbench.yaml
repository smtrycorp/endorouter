# LiteLLM 1.103.1 proxy for the leakbench head-to-head.
# cloud-model points at leakbench's recording fake cloud (8799); on-prem-model at its fake local (8800).
# Guardrail: LiteLLM's built-in content filter with every data-relevant prebuilt pattern, the keywords from LiteLLM's
# sensitive-data-routing docs, and on_sensitive_data=route toward on-prem-model (the documented intent).
model_list:
  - model_name: cloud-model
    litellm_params: {model: openai/fake-cloud, api_base: "http://127.0.0.1:8799/v1", api_key: "leakbench-dummy"}
  - model_name: on-prem-model
    litellm_params: {model: openai/fake-local, api_base: "http://127.0.0.1:8800/v1", api_key: "leakbench-dummy"}
guardrails:
  - guardrail_name: sensitive-data
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: true
      on_sensitive_data: route
      sensitive_data_route_to_model: on-prem-model
      patterns:
        - {pattern_type: prebuilt, pattern_name: us_ssn, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: us_ssn_no_dash, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: email, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: us_phone, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: credit_card, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: aws_access_key, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: aws_secret_key, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: github_token, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: slack_token, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: generic_api_key, action: BLOCK}
        - {pattern_type: regex, name: project_titan, pattern: "project\\s+titan", action: BLOCK}
      blocked_words:
        - {keyword: confidential, action: BLOCK}
        - {keyword: internal only, action: BLOCK}
litellm_settings:
  telemetry: false
