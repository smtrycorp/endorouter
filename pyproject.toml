[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-router"
version = "0.1.0.dev0"
description = "A model router that decides where a prompt is allowed to go before it decides which model is best. Default local; cloud only when provenance says public. Every decision audited."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6", "starlette>=0.37", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
sovereign-router = "sovereign_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sovereign_router = ["leakbench/*.jsonl", "example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
