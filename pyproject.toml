[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endorouter"
version = "0.1.1"
description = "A model router that decides where a prompt is allowed to go before it decides which model is best. Default local; cloud only when provenance says public. Every decision audited."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "J. I. Ashley Consulting LLC", email = "hello@smtry.ai" }]
requires-python = ">=3.10"
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["httpx>=0.27", "pyyaml>=6", "starlette>=0.37", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
endorouter = "endorouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endorouter = ["leakbench/*.jsonl", "example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, blind except, import order
select = ["F", "E", "W", "B", "BLE", "I"]
ignore = ["E501"]  # long lines are a style choice here, not a defect; the code wraps at about 120 by hand
